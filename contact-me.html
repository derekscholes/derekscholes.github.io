      <header class="heading">

    <main>
      
    <section class="contact-top-bar">
        <h3>Contact Form</h3>
    <p class="contact">Please fill out this form with the required information.</p>
      
    <form action="https://formsubmit.co/contact@ginutritiontherapy.com" method="POST" >
      
        <label for="name">Enter Your Name: <input id="name" name="name" type="text" required></label>
        <label for="email">Enter Your Email: <input id="email" name="email" type="email" required></label>
        <label for="referrer">How did you hear about us?
          <select id="referrer" name="referrer">
            <option value="">(select one)</option>
            <option value="Internet Search">Internet Search</option>
            <option value="Health Provider">Health Provider</option>
            <option value="Social Media">Social Media</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label for="message">Message:
          <textarea id="message" name="message" rows="4" placeholder="Comment here..."></textarea>
        </label>
      <input type="submit" value="Send">
    </form>
      </section>
    
       </main>
